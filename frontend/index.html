<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chiro Impact</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applique le thème (clair / sombre) avant l'affichage, pour éviter un flash blanc. Voir src/theme.js
      try {
        var c = localStorage.getItem('chiro-theme')
        if (c === 'sombre' || ((!c || c === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" />
  </head>
  <body class="bg-page text-slate font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
